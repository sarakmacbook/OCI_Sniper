<!-- ============================================================
     PART A — paste this panel right BEFORE the line:
         <!-- Action Bar -->
     ============================================================ -->
<div class="panel">
    <button class="panel-header" onclick="togglePanel('bv')">
        <span class="icon-group">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
            4. Boot volume manager
        </span>
        <svg id="bvChevron" class="chevron collapsed" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div id="bvBody" class="panel-body collapsed">
        <div class="btn-row">
            <button class="btn" id="bvScanBtn" onclick="scanBootVolumes()">Scan boot volumes</button>
            <button class="btn" id="bvInstBtn" onclick="loadBvInstances()">Load instances</button>
        </div>
        <div class="grid-2">
            <div class="form-group">
                <label class="form-label">Target instance (for attach)</label>
                <select id="bvInstanceSelect" class="form-select">
                    <option value="">-- Load instances first --</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">New size GB (resize / adjust)</label>
                <input type="number" id="bvNewSize" class="form-input" value="100" min="50" max="200">
            </div>
        </div>
        <div id="bvList"></div>
        <div id="bvInfo" style="margin-top:8px;font-size:11px;color:var(--text-muted);display:none;"></div>
    </div>
</div>

<!-- ============================================================
     PART B — paste this JS inside the <script> tag, e.g. just
     above:  window.addEventListener('load', () => {
     ============================================================ -->
<script>
let bvCache = [];

function getCreds() {
    parseConfig();
    return {
        user: document.getElementById('cfgUser').value,
        tenancy: document.getElementById('cfgTenancy').value,
        fingerprint: document.getElementById('cfgFingerprint').value,
        region: document.getElementById('cfgRegion').value,
        private_key: document.getElementById('cfgKey').value,
        timezone: userTimezone
    };
}

function bvCredsOk(c) {
    if (!c.user || !c.private_key) { addLog('Error: Credentials required first', 'error'); return false; }
    return true;
}

async function scanBootVolumes() {
    const creds = getCreds();
    if (!bvCredsOk(creds)) return;
    const btn = document.getElementById('bvScanBtn');
    const info = document.getElementById('bvInfo');
    btn.disabled = true; btn.textContent = 'Scanning...';
    try {
        const res = await fetch('/api/list-boot-volumes', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(creds)
        });
        const data = await res.json();
        if (data.success) {
            renderBootVolumes(data.boot_volumes);
            info.innerHTML = 'Found ' + data.boot_volumes.length + ' boot volume(s).';
            info.style.display = 'block';
            addLog('Found ' + data.boot_volumes.length + ' boot volume(s)', 'success');
        } else {
            info.innerHTML = '<span style="color:var(--danger)">' + data.error + '</span>';
            info.style.display = 'block';
            addLog('Boot volume scan failed: ' + data.error, 'error');
        }
    } catch (err) {
        addLog('Boot volume scan error: ' + err.message, 'error');
    }
    btn.disabled = false; btn.textContent = 'Scan boot volumes';
}

function renderBootVolumes(vols) {
    bvCache = vols;
    const list = document.getElementById('bvList');
    if (!vols.length) {
        list.innerHTML = '<div style="font-size:12px;color:var(--text-muted);padding:6px 0;">No boot volumes found.</div>';
        return;
    }
    let html = '';
    vols.forEach((v, i) => {
        const stateColor = v.is_attached ? 'var(--positive)' : 'var(--warning)';
        const attachLine = v.is_attached
            ? 'Attached: ' + (v.instance_name || v.instance_id.slice(0, 20)) + ' (' + (v.instance_state || '?') + ')'
            : 'Not attached';
        html += '<div class="instance-row" style="flex-wrap:wrap;">';
        html += '<div class="instance-info">';
        html += '<div class="instance-name">' + v.name + ' &mdash; ' + v.size_gb + ' GB</div>';
        html += '<div class="instance-meta"><span style="color:' + stateColor + '">' + v.state + '</span> | ' + attachLine + '</div>';
        html += '</div>';
        html += '<div style="display:flex;gap:4px;flex-shrink:0;">';
        if (v.is_attached) {
            html += '<button class="instance-delete" style="border-color:rgba(99,102,241,0.4);color:var(--accent);margin-left:0;" onclick="bvAdjust(' + i + ')" title="Auto: stop, detach, resize, re-attach, start">Adjust</button>';
            html += '<button class="instance-delete" style="border-color:rgba(99,102,241,0.4);color:var(--accent);margin-left:0;" onclick="bvResize(' + i + ')" title="Grow volume only (online)">Resize</button>';
            html += '<button class="instance-delete" style="border-color:rgba(245,158,11,0.3);color:var(--warning);margin-left:0;" onclick="bvDetach(' + i + ')" title="Detach (instance must be stopped)">Detach</button>';
        } else {
            html += '<button class="instance-delete" style="border-color:rgba(34,197,94,0.3);color:var(--positive);margin-left:0;" onclick="bvAttach(' + i + ')" title="Attach to selected instance">Attach</button>';
            html += '<button class="instance-delete" style="border-color:rgba(99,102,241,0.4);color:var(--accent);margin-left:0;" onclick="bvResize(' + i + ')" title="Grow volume">Resize</button>';
            html += '<button class="instance-delete" style="margin-left:0;" onclick="bvDelete(' + i + ')" title="Delete permanently">&#128465;</button>';
        }
        html += '</div></div>';
    });
    list.innerHTML = html;
}

async function loadBvInstances() {
    const creds = getCreds();
    if (!bvCredsOk(creds)) return;
    const btn = document.getElementById('bvInstBtn');
    const select = document.getElementById('bvInstanceSelect');
    btn.disabled = true; btn.textContent = 'Loading...';
    try {
        const res = await fetch('/api/list-instances', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(creds)
        });
        const data = await res.json();
        if (data.success && data.instances.length > 0) {
            select.innerHTML = '<option value="">-- Select instance --</option>';
            data.instances.forEach(inst => {
                const opt = document.createElement('option');
                opt.value = inst.id;
                opt.textContent = inst.name + ' (' + inst.state + ')';
                select.appendChild(opt);
            });
            addLog('Loaded ' + data.instances.length + ' instance(s)', 'success');
        } else {
            select.innerHTML = '<option value="">-- No instances found --</option>';
            addLog('No instances found' + (data.error ? ': ' + data.error : ''), 'warn');
        }
    } catch (err) {
        addLog('Instance load error: ' + err.message, 'error');
    }
    btn.disabled = false; btn.textContent = 'Load instances';
}

async function bvPower(instanceId, action) {
    const creds = getCreds();
    if (!bvCredsOk(creds)) return;
    addLog('Sending ' + action + ' to instance...', 'warn');
    try {
        const res = await fetch('/api/instance-power', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.assign({}, creds, { instance_id: instanceId, action: action }))
        });
        const data = await res.json();
        if (data.success) addLog(data.message, 'success');
        else addLog('Power action failed: ' + data.error, 'error');
    } catch (err) {
        addLog('Power action error: ' + err.message, 'error');
    }
}

async function bvDetach(i) {
    const v = bvCache[i];
    if (!v || !v.is_attached) { addLog('Volume is not attached', 'warn'); return; }
    if (v.instance_state !== 'STOPPED') {
        if (!confirm('Instance "' + (v.instance_name || '') + '" is ' + v.instance_state + '.\nIt must be STOPPED before its boot volume can be detached.\n\nStop it now? (wait ~1-2 min, re-scan, then Detach)')) return;
        await bvPower(v.instance_id, 'STOP');
        return;
    }
    if (!confirm('Detach boot volume "' + v.name + '" (' + v.size_gb + ' GB) from "' + v.instance_name + '"?')) return;
    const creds = getCreds();
    if (!bvCredsOk(creds)) return;
    addLog('Detaching "' + v.name + '"...', 'warn');
    try {
        const res = await fetch('/api/detach-boot-volume', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.assign({}, creds, { boot_volume_id: v.id }))
        });
        const data = await res.json();
        if (data.success) { addLog(data.message, 'success'); setTimeout(scanBootVolumes, 5000); }
        else addLog('Detach failed: ' + data.error, 'error');
    } catch (err) {
        addLog('Detach error: ' + err.message, 'error');
    }
}

async function bvAttach(i) {
    const v = bvCache[i];
    const instanceId = document.getElementById('bvInstanceSelect').value;
    if (!instanceId) { addLog('Error: pick a target instance first (Load instances)', 'error'); return; }
    if (!confirm('Attach "' + v.name + '" (' + v.size_gb + ' GB) to the selected instance?\nThe instance must be STOPPED.')) return;
    const creds = getCreds();
    if (!bvCredsOk(creds)) return;
    addLog('Attaching "' + v.name + '"...', 'info');
    try {
        const res = await fetch('/api/attach-boot-volume', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.assign({}, creds, { boot_volume_id: v.id, instance_id: instanceId }))
        });
        const data = await res.json();
        if (data.success) { addLog(data.message, 'success'); setTimeout(scanBootVolumes, 5000); }
        else addLog('Attach failed: ' + data.error, 'error');
    } catch (err) {
        addLog('Attach error: ' + err.message, 'error');
    }
}

async function bvResize(i) {
    const v = bvCache[i];
    const newSize = parseInt(document.getElementById('bvNewSize').value);
    if (!newSize || newSize < 50 || newSize > 200) { addLog('Error: new size must be 50-200 GB', 'error'); return; }
    if (newSize <= v.size_gb) { addLog('Error: new size (' + newSize + ') must be larger than current ' + v.size_gb + ' GB (OCI cannot shrink)', 'error'); return; }
    if (!confirm('Grow "' + v.name + '" from ' + v.size_gb + ' GB to ' + newSize + ' GB?\n\nAfterwards expand the partition/filesystem inside the OS.')) return;
    const creds = getCreds();
    if (!bvCredsOk(creds)) return;
    try {
        const res = await fetch('/api/resize-boot-volume', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.assign({}, creds, { boot_volume_id: v.id, new_size_gb: newSize }))
        });
        const data = await res.json();
        if (data.success) { addLog(data.message, 'success'); setTimeout(scanBootVolumes, 3000); }
        else addLog('Resize failed: ' + data.error, 'error');
    } catch (err) {
        addLog('Resize error: ' + err.message, 'error');
    }
}

async function bvDelete(i) {
    const v = bvCache[i];
    if (v.is_attached) { addLog('Error: detach the volume before deleting', 'error'); return; }
    const msg = 'DANGER: Delete boot volume "' + v.name + '" (' + v.size_gb + ' GB)?\n\nThis CANNOT be undone. All data on it will be lost.\n\nType DELETE to confirm:';
    if (prompt(msg) !== 'DELETE') { addLog('Delete cancelled', 'warn'); return; }
    const creds = getCreds();
    if (!bvCredsOk(creds)) return;
    addLog('Deleting "' + v.name + '"...', 'error');
    try {
        const res = await fetch('/api/delete-boot-volume', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.assign({}, creds, { boot_volume_id: v.id }))
        });
        const data = await res.json();
        if (data.success) { addLog(data.message, 'success'); setTimeout(scanBootVolumes, 3000); }
        else addLog('Delete failed: ' + data.error, 'error');
    } catch (err) {
        addLog('Delete error: ' + err.message, 'error');
    }
}

async function bvAdjust(i) {
    const v = bvCache[i];
    if (!v.is_attached) { addLog('Error: Adjust works on attached volumes (use Resize for detached ones)', 'error'); return; }
    const newSize = parseInt(document.getElementById('bvNewSize').value);
    if (!newSize || newSize < 50 || newSize > 200) { addLog('Error: new size must be 50-200 GB', 'error'); return; }
    if (newSize <= v.size_gb) { addLog('Error: new size (' + newSize + ') must be larger than current ' + v.size_gb + ' GB', 'error'); return; }
    const msg = 'ADJUST boot volume of "' + (v.instance_name || v.name) + '"\n\n' +
        v.size_gb + ' GB  ->  ' + newSize + ' GB\n\n' +
        'The server will automatically:\n' +
        '1. STOP the instance\n' +
        '2. Detach the boot volume\n' +
        '3. Resize it\n' +
        '4. Re-attach it\n' +
        '5. START the instance\n\n' +
        'A few minutes of downtime. Continue?';
    if (!confirm(msg)) { addLog('Adjust cancelled', 'warn'); return; }
    const creds = getCreds();
    if (!bvCredsOk(creds)) return;
    addLog('Starting adjust workflow for "' + v.name + '" -> ' + newSize + ' GB...', 'warn');
    try {
        const res = await fetch('/api/adjust-boot-volume', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.assign({}, creds, {
                instance_id: v.instance_id, new_size_gb: newSize,
                telegram_bot_token: document.getElementById('tgToken').value.trim(),
                telegram_chat_id: document.getElementById('tgChat').value.trim()
            }))
        });
        const data = await res.json();
        if (data.success) {
            addLog(data.message, 'success');
            startPolling();
            setTimeout(scanBootVolumes, 20000);
        } else {
            addLog('Adjust failed: ' + data.error, 'error');
        }
    } catch (err) {
        addLog('Adjust error: ' + err.message, 'error');
    }
}
</script>
